apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trip-service
  template:
    metadata:
      labels:
        app: trip-service
    spec:
      containers:
        - name: trip-service
          image: europe-west1-docker.pkg.dev/{{PROJECT_ID}}/ride-sharing/trip-service
          ports:
            - containerPort: 8083
          env:
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  key: REDIS_ADDR
                  name: app-config
            - name: REDIS_DB
              valueFrom:
                configMapKeyRef:
                  key: REDIS_DB
                  name: app-config
            - name: REDIS_MASTER_NAME
              valueFrom:
                configMapKeyRef:
                  key: REDIS_MASTER_NAME
                  name: app-config
            - name: REDIS_SENTINEL_ADDRS
              valueFrom:
                configMapKeyRef:
                  key: REDIS_SENTINEL_ADDRS
                  name: app-config
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: trip-service
spec:
  selector:
    app: trip-service
  ports:
    - port: 8083
      name: http
      targetPort: 8083
  type: ClusterIP

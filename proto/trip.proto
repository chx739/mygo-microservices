syntax = "proto3";

package trip;

option go_package = "shared/proto/trip;trip";

service TripService {
  rpc PreviewTrip(PreviewTripRequest) returns (PreviewTripResponse);
  rpc CreateTrip(CreateTripRequest) returns (CreateTripResponse);
  // GetTrip：按 tripID 取单条 Trip。演唱会压测方案 § 3.Step 4.3 新增。
  // 实现复用现有 service.GetTripByID（含 Bloom 预检），api-gateway 通过 GET /trip/:id 透传。
  rpc GetTrip(GetTripRequest) returns (GetTripResponse);
}

message PreviewTripRequest {
  string userID = 1;
  Coordinate startLocation = 2;
  Coordinate endLocation = 3;
}

message PreviewTripResponse {
  string tripID = 1;
  Route route = 2;
  repeated RideFare rideFares = 3;
}

message Coordinate {
  double latitude = 1;
  double longitude = 2;
}

message Geometry {
  repeated Coordinate coordinates = 1;
}

message Route {
  repeated Geometry geometry = 1;
  double distance = 2;
  double duration = 3;
}

message RideFare {
  string id = 1;
  string userID = 2;
  string packageSlug = 3;
  double totalPriceInCents = 4;
}

message CreateTripRequest {
  string rideFareID = 1;
  string userID = 2;
}

message CreateTripResponse {
  string tripID = 1;
  Trip trip = 2;
}

// GetTripRequest / GetTripResponse 配合 GetTrip rpc。
// trip-service handler 遇到 Bloom miss 或 Mongo not found 返回 codes.NotFound；
// api-gateway 透传时把 NotFound 映射回 HTTP 404。
message GetTripRequest {
  string tripID = 1;
}

message GetTripResponse {
  Trip trip = 1;
}

message Trip {
  string id = 1;
  RideFare selectedFare = 2;
  Route route = 3;
  string status = 4;
  string userID = 5;
  TripDriver driver = 6;
}

// Static driver object that is used to store the driver information
message TripDriver {
  string id = 1;
  string name = 2;
  string profilePicture = 3;
  string carPlate = 4;
}